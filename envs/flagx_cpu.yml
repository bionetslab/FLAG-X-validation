# Conda env for FLAG-X (flagx 0.2.1, the version used for the paper; bioconda) and for data curation (curate_data.py)
# PyTorch: CPU build from conda-forge.
# Create with: conda env create -f envs/flagx_cpu.yml
name: fx_flagx_cpu
channels:
  - conda-forge
  - bioconda
  - defaults

channel_priority: strict

dependencies:
  - flagx=0.2.1
  - pytorch=*=cpu*
