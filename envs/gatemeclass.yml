# Env for GateMeClass (Caligola et al. 2024, Bioinformatics, doi:10.1093/bioinformatics/btae322), used from Python via rpy2
# Official code: https://github.com/simo1c/GateMeClass (R, MIT), commit a93e0202336f7048324c7c8b9b60ee965104f4d5
# All R deps from its DESCRIPTION (Depends) are installed from conda; plyr (used via plyr::mapvalues but not declared) is added.
# GateMeClass itself is not on conda; install the pinned commit after creating the env (no deps, no compilation):
#   CONDA_CHANNEL_PRIORITY=strict conda env create -f envs/gatemeclass.yml
#   conda run -n fx_gatemeclass Rscript -e "remotes::install_github('simo1c/GateMeClass', ref='a93e0202336f7048324c7c8b9b60ee965104f4d5', dependencies=FALSE, upgrade='never')"
# Use with an ACTIVATED env (conda activate fx_gatemeclass / conda run -n fx_gatemeclass ...): r-base sets R_HOME on activation;
# calling the env python directly without activation lets rpy2 pick up the system R (fails with undefined symbols).
# rpy2 >= 3.6: numpy2ri/pandas2ri.activate()/deactivate() raise DeprecationWarning; use
#   `with (ro.default_converter + numpy2ri.converter + pandas2ri.converter).context(): ...` instead.
# Tested versions (2026-11-03): python 3.12.16, numpy 2.5.4, pandas 3.1.0, scikit-learn 1.9.1, rpy2 3.6.6, R 4.4.3,
#   GateMeClass 1.0.0 (commit a93e020), mclust 6.1.3, batchelor 1.22.0, caret 7.0.1, recipes 1.4.0, dplyr 1.2.1, plyr 1.8.9
name: fx_gatemeclass
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.12
  - numpy
  - pandas
  - scikit-learn
  - rpy2
  - r-base=4.4
  - r-remotes
  # GateMeClass R deps (DESCRIPTION Depends)
  - r-stringi
  - r-data.table
  - r-moments
  - r-mclust
  - r-stringr
  - r-scales
  - r-recipes
  - r-dplyr
  - r-rcppalgos
  - r-caret
  - r-biocmanager
  - bioconductor-batchelor
  - r-plyr
