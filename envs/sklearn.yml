# Lightweight env for the tabular scikit-learn baselines (RF, HistGradientBoosting, LogisticRegression, kNN, LDA)
# and the GMM classifier of Mocking et al. 2024 (validation/gating/gmm_mocking.py). No flagx / torch / somoclu.
# Create with: CONDA_CHANNEL_PRIORITY=strict conda env create -f envs/sklearn.yml
# Tested versions (2026-11-04): python 3.12.16, numpy 2.5.4, scikit-learn 1.9.1, scipy 1.18.1
name: fx_sklearn
channels:
  - conda-forge
  - nodefaults

channel_priority: strict

dependencies:
  - python=3.12
  - numpy
  - scikit-learn
