# Conda env for figure generation (plot_*.py).
# Create with: CONDA_CHANNEL_PRIORITY=strict conda env create -f envs/plot.yml
# Tested versions (2026-11-10): python 3.12.16, numpy 2.5.4, pandas 3.1.0, scipy 1.18.1, statsmodels 0.15.0, matplotlib 3.11.2, seaborn 0.13.2
name: fx_plot
channels:
  - conda-forge
  - nodefaults

channel_priority: strict

dependencies:
  - python=3.12
  - numpy
  - pandas
  - matplotlib
  - seaborn
  - scipy
  - statsmodels
