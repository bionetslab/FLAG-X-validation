[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "flagx"
version = "0.1.0"
description = "Flow cytometry Automated Gating toolboX"
readme = "README.md"
requires-python = ">=3.10,<3.14"

authors = [
    { name="Paul Martini", email="paul.martini@fau.de" }
]

license = { text = "GNU General Public License v3 (GPLv3)" }

urls = { Homepage = "https://github.com/bionetslab/FLAG-X-validation" }

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]

dependencies = [
    # --- core scientific stack ---
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "seaborn",

    # --- machine learning / stats ---
    "scikit-learn",
    "statsmodels",
    "numba",
    "umap-learn",

    # --- pytorch ---
    "torch",
    "torchvision",
    "torchaudio",

    # --- single-cell + flow cytometry ---
    "anndata",
    "scanpy",
    "igraph",
    "leidenalg",

    # --- flow cytometry readers ---
    "fcsparser",
    "flowio",
    "flowutils",
    "readfcs",
    "pytometry",

    # --- misc utilities ---
    "tqdm",
    "requests",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = "*"
numpy = "*"
scipy = "*"
pandas = "*"
matplotlib = "*"
seaborn = "*"
scikit-learn = "*"
statsmodels = "*"
numba = "*"
umap-learn = "*"
torch = "*"
anndata = "*"
scanpy = "*"
igraph = "*"
leidenalg = "*"
fcsparser = "*"
flowio = "*"
flowutils = "*"
readfcs = "*"
pytometry = "*"
tqdm = "*"
requests = "*"

[tool.pixi.pypi-dependencies]
flowcy-tools = { path = ".", editable = true }
